name: Pull Request Checks

on:
  pull_request:
    branches: [ main, dev ]
    types: [opened, synchronize, reopened]

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    
    - name: 🔍 Check commit messages
      run: |
        echo "Checking commit messages format..."
        git log --format=%s origin/${{ github.base_ref }}..${{ github.sha }} | \
        grep -qE '^(feat|fix|docs|style|refactor|test|chore)(\(.+\))?: .+' || \
        echo "⚠️ Some commits don't follow conventional commits format"

  docker-build-test:
    name: Test Docker Build
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: 🏗️ Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: devops-app:test
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: ✅ Docker build successful
      run: echo "Docker image built successfully!"

  pr-comment:
    name: PR Auto Comment
    runs-on: ubuntu-latest
    needs: [code-quality, docker-build-test]
    if: always()
    
    permissions:
      pull-requests: write
    
    steps:
    - name: 💬 Comment PR
      uses: actions/github-script@v7
      with:
        script: |
          const results = {
            'Code Quality': '${{ needs.code-quality.result }}',
            'Docker Build': '${{ needs.docker-build-test.result }}'
          };
          
          let body = '## 🤖 Pull Request Checks\n\n';
          
          for (const [check, result] of Object.entries(results)) {
            const icon = result === 'success' ? '✅' : result === 'failure' ? '❌' : '⚠️';
            body += `${icon} **${check}**: ${result}\n`;
          }
          
          const allSuccess = Object.values(results).every(r => r === 'success');
          
          if (allSuccess) {
            body += '\n✨ All checks passed! This PR is ready for review.';
          } else {
            body += '\n⚠️ Some checks failed. Please review the errors above.';
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
